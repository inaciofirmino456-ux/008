<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aave Sepolia Flash Loan</title>
<style>
body{font-family:Arial,sans-serif;background:#0b0f14;color:#fff;display:flex;justify-content:center;padding:30px}
main{max-width:520px;width:100%;background:#151b23;padding:24px;border-radius:18px}
button{width:100%;padding:16px;border:0;border-radius:12px;background:#6d5dfc;color:white;font-size:17px;font-weight:700;margin-top:14px}
input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #394250;background:#0f141b;color:#fff;font-size:16px;margin-top:8px}
small{color:#aeb7c4}.ok{color:#6ee7b7}.err{color:#ff8f8f}
</style>
</head>
<body>
<main>
<h2>DISPARAR ARBITRAGEM</h2>
<p><small>Sepolia • pronto para assinar no Rabby</small></p>
<label>Quantidade de USDC (unidades mínimas)</label><input id="amount" value="1" inputmode="numeric">
<button id="connect">CONECTAR E DISPARAR</button><button id="loan" disabled>ASSINAR GAS NO RABBY</button>
<p id="status"><small>Primeiro conecta a carteira.</small></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.umd.min.js"></script>
<script>
const CONTRACT="0xa2127506309Ce12894b12b00029B01C9bffB6b32";
const USDC="0x94a9D9AC8a22534E3FaCa9F4e7F2E2cf85d5E4C8";
const ABI=[{"inputs":[{"internalType":"address","name":"asset","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"requestFlashLoan","outputs":[],"stateMutability":"nonpayable","type":"function"}];
let signer,contract;
const status=document.getElementById("status");
function setStatus(t,c=""){status.className=c;status.innerHTML="<small>"+t+"</small>"}
document.getElementById("connect").onclick=async()=>{
 try{
  if(!window.ethereum) throw new Error("A Rabby não foi detectada. Abra esta página dentro da Rabby.");
  const provider=new ethers.BrowserProvider(window.ethereum);
  const net=await provider.getNetwork();
  if(net.chainId!==11155111n) throw new Error("Mude a Rabby para Ethereum Sepolia.");
  await provider.send("eth_requestAccounts",[]);
  signer=await provider.getSigner();
  const addr=await signer.getAddress();
  contract=new ethers.Contract(CONTRACT,ABI,signer);
  document.getElementById("loan").disabled=false;
  setStatus("Carteira ligada. A preparar a assinatura…","ok");
  setTimeout(()=>document.getElementById("loan").click(),300);
 }catch(e){setStatus(e.shortMessage||e.message||String(e),"err")}
};
document.getElementById("loan").onclick=async()=>{
 try{
  if(!contract) throw new Error("Conecta primeiro.");
  const amount=document.getElementById("amount").value.trim();
  if(!/^[0-9]+$/.test(amount)||amount==="0") throw new Error("Quantidade inválida.");
  setStatus("A preparar a transação… a Rabby deve abrir a confirmação.");
  const tx=await contract.requestFlashLoan(USDC,BigInt(amount));
  setStatus("Transação enviada. Hash: "+tx.hash,"ok");
  await tx.wait();
  setStatus("Concluído. O flash loan foi executado e liquidado na mesma transação.","ok");
 }catch(e){setStatus(e.shortMessage||e.reason||e.message||String(e),"err")}
};
</script>
</body>
</html>
