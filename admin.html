<!doctype html><html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NELA — Administração</title><link rel="stylesheet" href="styles.css"><style>body{padding:35px;max-width:1000px;margin:auto}.panel{background:#0a110c;border:1px solid #ffffff15;border-radius:20px;padding:25px;margin:20px 0}label{display:block;color:#8d978e;font-size:12px;margin:15px 0 7px}input,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #ffffff18;background:#050807;color:white}button{cursor:pointer}.save{border:0;margin-top:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><a class="ghost" href="/">← Voltar ao site</a><h1 style="font-family:Anton;font-size:55px">NELA <em style="color:#a6ff00">ADMIN</em></h1><div id="login" class="panel"><h2>Acesso</h2><input id="pin" type="password" placeholder="PIN"><button class="btn btn-neon save" onclick="login()">Entrar</button></div><div id="app" style="display:none"><div class="panel"><h2>Dados do negócio</h2><label>WhatsApp</label><input id="phone"><label>Morada</label><input id="address"><label>Texto principal</label><textarea id="hero"></textarea><label>Horário de abertura</label><input id="hours"></div><div class="panel"><h2>Produtos</h2><div id="products"></div><button class="btn btn-neon save" onclick="save()">Guardar alterações</button><button class="btn" onclick="resetData()">Restaurar dados iniciais</button></div><p style="color:#687268;font-size:12px">Guardado neste dispositivo. Para sincronizar alterações entre vários dispositivos, será necessário um backend.</p></div><script>const defaults={"phone":"244925122648","address":"R. Sagrada Esperança, Luanda, Angola","hero":"Carne suculenta, pão macio e aquele sabor que dá vontade de voltar.","hours":{"seg":"08:00 — 23:00","ter":"08:00 — 23:00","qua":"08:00 — 23:00","qui":"08:00 — 23:00","sex":"08:00 — 23:00","sab":"08:00 — 23:00","dom":"08:00 — 23:00"},"products":[["Hambúrguer Clássico","Pão, carne, queijo, alface e tomate.","2.500 Kz","https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=85"],["Hambúrguer Duplo","2 carnes, queijo, alface e molho especial.","3.500 Kz","https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=900&q=85"],["Hambúrguer Especial","Carne, queijo, bacon, ovo e molho da casa.","4.000 Kz","https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?auto=format&fit=crop&w=900&q=85"],["Chicken Burger","Frango crocante, queijo e alface.","2.800 Kz","https://images.unsplash.com/photo-1606755962773-d324e0a13086?auto=format&fit=crop&w=900&q=85"],["Batatas NELA","Crocantes e douradas.","Consultar","https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=900&q=85"],["Chicken Bites","Pequenos, crocantes e cheios de sabor.","Consultar","https://images.unsplash.com/photo-1562967916-eb82221dfb92?auto=format&fit=crop&w=900&q=85"]]};let d=JSON.parse(localStorage.getItem("nelaData")||"null")||defaults;function login(){if(pin.value==="2026"){loginEl.style.display="none";app.style.display="block";load()}else alert("PIN incorreto")}const loginEl=document.getElementById("login");function load(){phone.value=d.phone;address.value=d.address;hero.value=d.hero;hours.value=d.hours.seg;products.innerHTML=d.products.map((p,i)=>`<div class="panel"><strong>${i+1}. ${p[0]}</strong><label>Nome</label><input data-i="${i}" data-k="0" value="${p[0]}"><label>Descrição</label><input data-i="${i}" data-k="1" value="${p[1]}"><label>Preço</label><input data-i="${i}" data-k="2" value="${p[2]}"><label>Imagem</label><input data-i="${i}" data-k="3" value="${p[3]}"></div>`).join("")}function save(){d.phone=phone.value.replace(/\\D/g,"");d.address=address.value;d.hero=hero.value;Object.keys(d.hours).forEach(k=>d.hours[k]=hours.value);document.querySelectorAll("[data-i]").forEach(x=>d.products[x.dataset.i][x.dataset.k]=x.value);localStorage.setItem("nelaData",JSON.stringify(d));alert("Guardado!")}function resetData(){localStorage.removeItem("nelaData");location.reload()}</script></body></html>
